<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Attendance System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <div class="header">
    EDUGATE ATTENDANCE SYSTEM
  </div>

  <!-- College Name -->
  <h2 class="college-name">Bharatiya Jain Sanghatana's College</h2>

  <!-- Navbar -->
  <nav class="navbar">
    <ul>
      <li><a class="nav-link" href="index.html">Home</a></li>
      <li><a class="nav-link" href="student.html">Students</a></li>
      <li><a class="nav-link" href="attendance.html">Attendance</a></li>
      <li><a class="nav-link" href="timetable.html">Time Table</a></li>
      <li><a class="nav-link active" href="report.html">Reports</a></li>
      <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
     
    </ul>
  </nav>

  <!-- Report Content -->
  <div class="container">
    <h2>📊 Attendance Reports</h2>
    <table>
      <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Total Days</th>
        <th>Present</th>
        <th>Absent</th>
        <th>Percentage</th>
      </tr>
    </table>
    <tbody id="report-body">
      <!-- Report will be loaded here -->
    </tbody>
    </table>

<script>
async function loadReport() {
  const tbody = document.getElementById("report-body");
  try {
    const res = await fetch("http://localhost:3000/report");
    const report = await res.json();
    tbody.innerHTML = "";
    report.forEach((row, idx) => {
      tbody.innerHTML += `
        <tr>
          <td>${idx + 1}</td>
          <td>${row.name}</td>
          <td>${row.total_days}</td>
          <td>${row.present}</td>
          <td>${row.absent}</td>
          <td>${row.percentage}%</td>
        </tr>
      `;
    });
  } catch (err) {
    tbody.innerHTML = "<tr><td colspan='6'>Error loading report</td></tr>";
  }
}
window.onload = loadReport;
</script>
  </div>

</body>
</html>
