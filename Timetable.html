<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Time Table - Attendance System</title>
  <link rel="stylesheet" href="style.css"> <!-- External CSS -->
</head>
<body>
  <!-- Header -->
  <div class="header">
    EDUGATE ATTENDANCE SYSTEM
  </div>

  <!-- College Name -->
  <h1 class="college-name">Bharatiya Jain Sanghatana's College</h1>

  <!-- Navbar -->
  <nav class="navbar">
    <ul>
      <li><a class="nav-link" href="index.html">Home</a></li>
      <li><a class="nav-link" href="student.html">Students</a></li>
      <li><a class="nav-link" href="attendance.html">Attendance</a></li>
      <li><a class="nav-link" href="timetable.html">Time Table</a></li>
      <li><a class="nav-link" href="report.html">Reports</a></li>
      <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
      
    </ul>
  </nav>

  <!-- Container -->
  <div class="timetable-container">
    <h2>📅 Class Time Table</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Day</th>
          <th>Class / Batch</th>
          <th>Period Time</th>
          <th>Subject</th>
          <th>Teacher</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="timetable-body">
        <!-- Timetable entries will be loaded here -->
      </tbody>
    </table>
    <button class="add-btn" onclick="showAddForm()">➕ Add New Entry</button>

    <!-- Add/Edit Form Modal -->
    <div id="timetableModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeTimetable">&times;</span>
        <h2 id="modalTitle">Add Timetable Entry</h2>
        <form id="timetableForm">
          <input type="date" id="ttDate" required>
          <input type="text" id="ttDay" placeholder="Day" required>
          <input type="text" id="ttClass" placeholder="Class / Batch" required>
          <input type="text" id="ttPeriod" placeholder="Period Time" required>
          <input type="text" id="ttSubject" placeholder="Subject" required>
          <input type="text" id="ttTeacher" placeholder="Teacher" required>
          <button type="submit" id="ttSubmitBtn">Add</button>
        </form>
      </div>
    </div>
  </div>


<script>
let editId = null;

async function loadTimetable() {
  const tbody = document.getElementById("timetable-body");
  try {
    const res = await fetch("http://localhost:3000/timetable");
    const timetable = await res.json();
    console.log("Fetched timetable:", timetable); // Debug log
    tbody.innerHTML = "";
    timetable.forEach((row) => {
      tbody.innerHTML += `
        <tr>
          <td>${row.date}</td>
          <td>${row.day}</td>
          <td>${row.class}</td>
          <td>${row.period_time}</td>
          <td>${row.subject}</td>
          <td>${row.teacher}</td>
          <td>
            <button class="tt-action-btn tt-edit-btn" onclick="editEntry(${row.id})">Edit</button>
            <button class="tt-action-btn tt-delete-btn" onclick="deleteEntry(${row.id})">Delete</button>
          </td>
        </tr>
      `;
    });
  } catch (err) {
    tbody.innerHTML = "<tr><td colspan='7'>Error loading timetable</td></tr>";
  }
}
window.onload = loadTimetable;

function showAddForm() {
  editId = null;
  document.getElementById("modalTitle").textContent = "Add Timetable Entry";
  document.getElementById("ttDate").value = "";
  document.getElementById("ttDay").value = "";
  document.getElementById("ttClass").value = "";
  document.getElementById("ttPeriod").value = "";
  document.getElementById("ttSubject").value = "";
  document.getElementById("ttTeacher").value = "";
  document.getElementById("ttSubmitBtn").textContent = "Add";
  document.getElementById("timetableModal").style.display = "block";
}

function editEntry(id) {
  fetch(`http://localhost:3000/timetable/${id}`)
    .then(res => res.json())
    .then(row => {
      editId = id;
      document.getElementById("modalTitle").textContent = "Edit Timetable Entry";
      document.getElementById("ttDate").value = row.date;
      document.getElementById("ttDay").value = row.day;
      document.getElementById("ttClass").value = row.class;
      document.getElementById("ttPeriod").value = row.period_time;
      document.getElementById("ttSubject").value = row.subject;
      document.getElementById("ttTeacher").value = row.teacher;
      document.getElementById("ttSubmitBtn").textContent = "Update";
      document.getElementById("timetableModal").style.display = "block";
    });
}

function deleteEntry(id) {
  if (!confirm("Are you sure you want to delete this entry?")) return;
  fetch(`http://localhost:3000/timetable/${id}`, { method: "DELETE" })
    .then(res => res.json())
    .then(() => loadTimetable());
}

document.getElementById("timetableForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const date = document.getElementById("ttDate").value;
  const day = document.getElementById("ttDay").value;
  const classBatch = document.getElementById("ttClass").value;
  const period_time = document.getElementById("ttPeriod").value;
  const subject = document.getElementById("ttSubject").value;
  const teacher = document.getElementById("ttTeacher").value;
  const entry = { date, day, class: classBatch, period_time, subject, teacher };
  let url = "http://localhost:3000/timetable";
  let method = "POST";
  if (editId) {
    url += `/${editId}`;
    method = "PUT";
  }
  try {
    await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry)
    });
    document.getElementById("timetableModal").style.display = "none";
    loadTimetable();
  } catch (err) {
    alert("Error saving entry");
  }
});

document.getElementById("closeTimetable").onclick = function() {
  document.getElementById("timetableModal").style.display = "none";
};

window.onclick = function(event) {
  const modal = document.getElementById("timetableModal");
  if (event.target === modal) {
    modal.style.display = "none";
  }
};
</script>
</body>
</html>
